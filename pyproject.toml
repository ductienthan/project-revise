[project]
name = "preflight"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "click>=8.1",
  "rich>=13.7",
  "pyotp>=2.9",
  "keyring>=25.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
capture = ["trafilatura>=1.12"]
browser = ["playwright>=1.47"]

[project.scripts]
preflight = "preflight.cli.main:cli"
preflight-server = "preflight.server.manage:manage"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Form", "fastapi.Depends"]
